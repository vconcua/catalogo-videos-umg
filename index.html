<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo de Videos Educativos - UMG</title>
  <style>
    :root {
      --primary: #003366;
      --secondary: #d90429;
      --bg: #f4f6f9;
      --text: #2b2d42;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding-bottom: 40px; }
    
    header { background-color: var(--primary); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.4rem; }
    .user-panel { display: flex; gap: 10px; align-items: center; }
    .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; background-color: var(--secondary); color: white; transition: 0.2s; }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background-color: #6c757d; }
    
    .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
    .controls { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
    .controls input, .controls select { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 200px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
    .card { background: white; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; cursor: pointer; }
    .card img { width: 100%; height: 160px; object-fit: cover; }
    .card-body { padding: 15px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .card-title { font-size: 1.1rem; margin-bottom: 8px; color: var(--primary); }
    .card-desc { font-size: 0.9rem; color: #555; margin-bottom: 12px; }
    .card-footer { display: flex; justify-content: space-between; align-items: center; font-size: 0.85rem; color: #888; }
    
    /* Modales */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 1000; }
    .modal.active { display: flex; }
    .modal-content { background: white; padding: 20px; border-radius: 8px; max-width: 600px; width: 90%; max-height: 90vh; overflow-y: auto; position: relative; }
    .close-btn { position: absolute; top: 10px; right: 15px; font-size: 1.5rem; cursor: pointer; border: none; background: none; }
    
    /* Formularios */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-size: 0.9rem; }
    .form-group input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    
    /* Comentarios y respuestas */
    .video-player { width: 100%; height: 315px; background: #000; margin-bottom: 15px; }
    .interaction-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    .comment-box { margin-top: 15px; }
    .comment-input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .comment-list { margin-top: 15px; }
    .comment-item { background: #f9f9f9; padding: 10px; border-radius: 6px; margin-bottom: 10px; border-left: 3px solid var(--primary); }
    .comment-header { font-weight: bold; font-size: 0.85rem; display: flex; justify-content: space-between; margin-bottom: 5px; }
    .reply-list { margin-left: 20px; margin-top: 8px; border-left: 2px solid #ddd; padding-left: 10px; }
    .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
    .text-danger { color: #d90429; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <h1>Catálogo Educativo UMG</h1>
    <div class="user-panel" id="userPanel">
      <button class="btn" onclick="openModal('modalLogin')">Iniciar Sesión</button>
      <button class="btn btn-secondary" onclick="openModal('modalRegister')">Registrarse</button>
    </div>
  </header>

  <div class="container">
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Buscar video por título..." oninput="filterVideos()">
      <select id="categorySelect" onchange="filterByCategory()">
        <option value="">Todas las Categorías</option>
      </select>
    </div>

    <div class="grid" id="videoGrid"></div>
  </div>

  <!-- Modal Login -->
  <div class="modal" id="modalLogin">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('modalLogin')">&times;</button>
      <h2>Iniciar Sesión</h2><br>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Carné o Correo Electronico</label>
          <input type="text" id="loginUser" required placeholder="Ej: 1890-20-11489 o usuario@correo.com">
        </div>
        <div class="form-group">
          <label>PIN (Sólo números)</label>
          <input type="password" id="loginPassword" required pattern="[0-9]+" title="El PIN debe contener únicamente números" placeholder="Ej: 1234">
        </div>
        <button type="submit" class="btn">Ingresar</button>
      </form>
    </div>
  </div>

  <!-- Modal Registro -->
  <div class="modal" id="modalRegister">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('modalRegister')">&times;</button>
      <h2>Registro de Estudiante</h2><br>
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Carné (Máscara: 9999-99-99999)</label>
          <input type="text" id="regCarne" required pattern="\d{4}-\d{2}-\d{5}" placeholder="1890-20-11489">
        </div>
        <div class="form-group">
          <label>Nombre Completo</label>
          <input type="text" id="regNombre" required placeholder="JUAN PEREZ">
        </div>
        <div class="form-group">
          <label>Correo Electrónico</label>
          <input type="email" id="regCorreo" required placeholder="juan.perez@correo.com">
        </div>
        <div class="form-group">
          <label>PIN (Sólo números)</label>
          <input type="password" id="regPassword" required pattern="[0-9]+" title="El PIN debe ser estrictamente numérico" placeholder="1234">
        </div>
        <button type="submit" class="btn">Registrarme</button>
      </form>
    </div>
  </div>

  <!-- Modal Detalle / Reproductor -->
  <div class="modal" id="modalVideo">
    <div class="modal-content">
      <button class="close-btn" onclick="closeModal('modalVideo')">&times;</button>
      <div id="videoContainer"></div>
    </div>
  </div>

  <script>
    const API_BASE = "https://back-semprivado-umg-h6fkf2bng2avgrgw.westus3-01.azurewebsites.net";
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let allVideos = [];
    let activeVideoData = null;

    document.addEventListener("DOMContentLoaded", () => {
      updateUserPanel();
      loadCategories();
      loadVideos();
    });

    // --- AUTENTICACIÓN ---
    function updateUserPanel() {
      const panel = document.getElementById('userPanel');
      if (currentUser) {
        panel.innerHTML = `
          <span>Bienvenido, <strong>${currentUser.estudiante || currentUser.carne}</strong></span>
          <button class="btn btn-secondary" onclick="logout()">Cerrar Sesión</button>
        `;
      } else {
        panel.innerHTML = `
          <button class="btn" onclick="openModal('modalLogin')">Iniciar Sesión</button>
          <button class="btn btn-secondary" onclick="openModal('modalRegister')">Registrarse</button>
        `;
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const payload = {
        carne: document.getElementById('regCarne').value,
        estudiante: document.getElementById('regNombre').value,
        correo: document.getElementById('regCorreo').value,
        password: document.getElementById('regPassword').value
      };

      try {
        const res = await fetch(`${API_BASE}/api/estudiantes/registrar`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (res.ok) {
          alert("Registro exitoso. Ya puedes iniciar sesión.");
          closeModal('modalRegister');
        } else {
          const err = await res.text();
          alert("Error en el registro: " + err);
        }
      } catch (err) {
        alert("Error de conexión al servidor.");
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const payload = {
        usuario: document.getElementById('loginUser').value,
        password: document.getElementById('loginPassword').value
      };

      try {
        const res = await fetch(`${API_BASE}/api/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          const data = await res.json();
          currentUser = data.estudiante || { carne: payload.usuario }; 
          if (!currentUser.carne && payload.usuario.includes('-')) currentUser.carne = payload.usuario;
          
          localStorage.setItem('currentUser', JSON.stringify(currentUser));
          updateUserPanel();
          closeModal('modalLogin');
          alert("Inicio de sesión correcto.");
        } else {
          alert("Credenciales inválidas.");
        }
      } catch (err) {
        alert("Error de conexión.");
      }
    }

    function logout() {
      localStorage.removeItem('currentUser');
      currentUser = null;
      updateUserPanel();
      if (activeVideoData) openVideoModal(activeVideoData.id);
    }

    // --- NAVEGACIÓN Y CATÁLOGO ---
    async function loadCategories() {
      try {
        const res = await fetch(`${API_BASE}/api/videos/categorias`);
        const categories = await res.json();
        const select = document.getElementById('categorySelect');
        categories.forEach(cat => {
          select.innerHTML += `<option value="${cat}">${cat}</option>`;
        });
      } catch (err) { console.error("Error cargando categorías", err); }
    }

    async function loadVideos() {
      try {
        const res = await fetch(`${API_BASE}/api/videos`);
        allVideos = await res.json();
        renderVideos(allVideos);
      } catch (err) { console.error("Error cargando videos", err); }
    }

    function renderVideos(videos) {
      const grid = document.getElementById('videoGrid');
      grid.innerHTML = "";
      videos.forEach(v => {
        grid.innerHTML += `
          <div class="card" onclick="openVideoModal('${v.id}')">
            <img src="${v.poster || 'https://via.placeholder.com/300x160?text=Video+Poster'}" alt="${v.titulo}">
            <div class="card-body">
              <h3 class="card-title">${v.titulo}</h3>
              <p class="card-desc">${v.descripcion ? v.descripcion.substring(0, 80) + '...' : ''}</p>
              <div class="card-footer">
                <span>⏱ ${v.duracion || 'N/A'}</span>
                <span>📂 ${v.categoria || 'General'}</span>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterVideos() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allVideos.filter(v => v.titulo.toLowerCase().includes(query));
      renderVideos(filtered);
    }

    async function filterByCategory() {
      const cat = document.getElementById('categorySelect').value;
      if (!cat) {
        loadVideos();
        return;
      }
      try {
        const res = await fetch(`${API_BASE}/api/videos/categoria/${encodeURIComponent(cat)}`);
        const videos = await res.json();
        renderVideos(videos);
      } catch (err) { console.error("Error al filtrar", err); }
    }

    // --- REPRODUCTOR E INTERACCIÓN ---
    async function openVideoModal(id) {
      try {
        const res = await fetch(`${API_BASE}/api/videos/${id}`);
        activeVideoData = await res.json();
        renderVideoDetail(activeVideoData);
        openModal('modalVideo');
      } catch (err) { alert("Error al obtener detalle del video."); }
    }

    function renderVideoDetail(video) {
      const container = document.getElementById('videoContainer');
      const isAuth = !!currentUser;
      
      const likesCount = video.likes ? video.likes.length : (video.likesCount || 0);

      container.innerHTML = `
        <h2>${video.titulo}</h2>
        <p style="color:#666; margin-bottom:10px;">${video.categoria || ''}</p>
        
        <iframe class="video-player" src="${video.url || video.videoUrl || ''}" frameborder="0" allowfullscreen></iframe>
        
        <div class="interaction-bar">
          <div>
            ${isAuth ? 
              `<button class="btn btn-sm" onclick="toggleLike('${video.id}')">❤️ Like (${likesCount})</button>` : 
              `<button class="btn btn-sm btn-secondary" onclick="promptLogin()">🔒 Inicia sesión para dar Like (${likesCount})</button>`
            }
          </div>
        </div>

        <p>${video.descripcion || ''}</p>
        <hr style="margin:15px 0;">

        <h3>Comentarios</h3>
        ${isAuth ? `
          <div class="comment-box">
            <textarea id="mainCommentText" class="comment-input" placeholder="Escribe un comentario..."></textarea>
            <button class="btn btn-sm" onclick="postComment('${video.id}')">Publicar Comentario</button>
          </div>
        ` : `<p style="color:#777; margin-top:10px;"><em>Inicia sesión para comentar.</em></p>`}

        <div class="comment-list">
          ${renderCommentsTree(video.comentarios || [])}
        </div>
      `;
    }

    function renderCommentsTree(comments) {
      if (!comments || comments.length === 0) return '<p style="font-size:0.9rem; color:#888;">No hay comentarios aún.</p>';
      
      return comments.map(c => `
        <div class="comment-item">
          <div class="comment-header">
            <span>${c.estudiante || c.carne}</span>
            ${currentUser && currentUser.carne === c.carne ? 
              `<span class="text-danger" onclick="deleteComment('${c.id}')">Eliminar</span>` : ''}
          </div>
          <div>${c.texto}</div>
          
          ${currentUser ? `
            <button class="btn btn-sm btn-secondary" style="margin-top:5px;" onclick="toggleReplyBox('${c.id}')">Responder</button>
            <div id="replyBox-${c.id}" class="comment-box" style="display:none; margin-top:5px;">
              <input type="text" id="replyInput-${c.id}" class="comment-input" placeholder="Responder a esta opinión...">
              <button class="btn btn-sm" onclick="postReply('${c.id}')">Enviar Respuesta</button>
            </div>
          ` : ''}

          <!-- Respuestas de 1er nivel de anidamiento -->
          ${c.respuestas && c.respuestas.length > 0 ? `
            <div class="reply-list">
              ${c.respuestas.map(r => `
                <div class="comment-item" style="background:#fff;">
                  <div class="comment-header">
                    <span>${r.estudiante || r.carne}</span>
                    ${currentUser && currentUser.carne === r.carne ? 
                      `<span class="text-danger" onclick="deleteComment('${r.id}')">Eliminar</span>` : ''}
                  </div>
                  <div>${r.texto}</div>
                </div>
              `).join('')}
            </div>
          ` : ''}
        </div>
      `).join('');
    }

    // --- ACCIONES DE INTERACCIÓN CON ENDPOINTS ---
    async function toggleLike(videoId) {
      try {
        const res = await fetch(`${API_BASE}/api/interaccionvideo/${videoId}/like`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ carne: currentUser.carne })
        });
        if (res.ok) openVideoModal(videoId);
      } catch (err) { console.error("Error al dar/quitar Like", err); }
    }

    async function postComment(videoId) {
      const texto = document.getElementById('mainCommentText').value;
      if (!texto.trim()) return;

      try {
        const res = await fetch(`${API_BASE}/api/interaccionvideo/${videoId}/comentario`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ carne: currentUser.carne, texto })
        });
        if (res.ok) openVideoModal(videoId);
      } catch (err) { console.error("Error al publicar comentario", err); }
    }

    function toggleReplyBox(commentId) {
      const box = document.getElementById(`replyBox-${commentId}`);
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    async function postReply(commentId) {
      const texto = document.getElementById(`replyInput-${commentId}`).value;
      if (!texto.trim()) return;

      try {
        const res = await fetch(`${API_BASE}/api/interaccionvideo/comentario/${commentId}/responder`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ carne: currentUser.carne, texto })
        });
        if (res.ok) openVideoModal(activeVideoData.id);
      } catch (err) { console.error("Error al responder comentario", err); }
    }

    async function deleteComment(commentId) {
      if (!confirm("¿Deseas eliminar este comentario?")) return;

      try {
        const res = await fetch(`${API_BASE}/api/interaccionvideo/comentario/${commentId}?carne=${currentUser.carne}`, {
          method: 'DELETE'
        });

        if (res.status === 403) {
          alert("Acceso denegado: Únicamente puedes eliminar tus propios comentarios.");
        } else if (res.ok) {
          openVideoModal(activeVideoData.id);
        } else {
          alert("Error al eliminar comentario.");
        }
      } catch (err) { console.error("Error en petición DELETE", err); }
    }

    // --- UTILIDADES ---
    function openModal(id) { document.getElementById(id).classList.add('active'); }
    function closeModal(id) { document.getElementById(id).classList.remove('active'); }
    function promptLogin() {
      closeModal('modalVideo');
      openModal('modalLogin');
    }
  </script>
</body>
</html>
